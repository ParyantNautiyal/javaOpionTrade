# ====================================
# OptionTrading Application Configuration
# ====================================

# Application name and version
app.name=OptionTrading
app.version=1.0.0

# ====================================
# Directories and File Paths
# ====================================
# Base directories
dir.config=config
dir.data=data
dir.logs=logs

# Authentication files
auth.credentials.file=config/kite_credentials.properties
auth.tokens.file=config/kite_tokens.properties

# Position data
position.data.dir=data/positions
position.active.file=data/positions/active_positions.dat
position.history.dir=data/positions/history

# Instruments data
instruments.dir=data/instruments

# ====================================
# Authentication Settings
# ====================================
# Kite Connect API configuration
kite.api.base=https://api.kite.trade
kite.login.url=https://kite.zerodha.com/connect/login
kite.session.token.url=/session/token

# Token properties
auth.token.validity.hours=8

# ====================================
# Thread Pool Configuration
# ====================================
# Default thread pool settings
thread.default.core.pool.size=2
thread.default.max.pool.size=4
thread.default.keep.alive.seconds=60

# ====================================
# Cache Configuration
# ====================================
# Instruments cache
cache.instruments.ttl.ms=86400000

# Position cache settings
position.cache.flush.threshold=15
position.cache.flush.interval.minutes=5

# ====================================
# Market Data Configuration
# ====================================
# Update interval in milliseconds
market.data.update.interval=1000
market.data.batch.size=400

# Order execution configuration
order.execution.delay.ms=150

# ====================================
# Trading Parameters
# ====================================
# Stop loss configuration
trading.default.stop.loss.percentage=5.0
# Hedge point difference
trading.default.hedge.point.difference=1500

# ====================================
# Monitoring Configuration
# ====================================
# Resource monitoring interval in seconds
monitor.interval.seconds=30

# ====================================
# Logging Configuration
# ====================================
log.file=logs/app.log 